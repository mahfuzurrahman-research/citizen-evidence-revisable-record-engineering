name: Public engineering validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: ./run_public_demo.sh
      - run: docker build -t citizen-evidence-revisable-record-engineering .
      - run: docker run --rm citizen-evidence-revisable-record-engineering
