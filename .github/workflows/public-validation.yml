name: Public engineering validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: ./run_all_demos.sh
      - run: docker build -t citizen-evidence-revisable-record-engineering .
      - run: docker run --rm citizen-evidence-revisable-record-engineering
      - uses: actions/upload-artifact@v4
        with:
          name: public-synthetic-record-audit
          path: outputs/
